<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External Survey Test Website</title>
    
    <!-- Optional: Embed standard SLDS styles to make the LWC render nicely -->
    <!-- Load SLDS directly from an external CDN for reliable public styling -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/design-system/2.24.2/styles/salesforce-lightning-design-system.min.css" integrity="sha512-VbIe1Fh3oJmI6O9b+mfeYV7DbyG87f3jZ20lS8AFr/104S6lB6Vv4q7VpXqW7E6R4gN0/M8Y40Yt3bZ2l6bKsw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 50px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .html-thanks-banner {
            display: none; /* Hidden by default */
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. The Parent HTML Success Message Container -->
        <div id="parent-thanks-box" class="html-thanks-banner">
                    🎉 Website Message: We have successfully saved your feedback to your account! Thank you for participating.
        </div>
        
        <h1>Welcome to Survey Portal</h1>
        <p>Please fill out our quick survey below. Your account number has been securely linked.</p>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <!-- 1. The target container where the Salesforce LWC will render -->
        <div id="survey-form-container"></div>
    </div>

    <!-- 2. Load the Lightning Out Javascript from your Salesforce Public Site -->
    <!-- REPLACE 'your-domain.my.site.com/survey' with your actual public site domain and path -->
    <script src="https://molina5--mo5dev2pro.sandbox.my.salesforce-sites.com/lightning/lightning.out.js"></script>

    <!-- 3. Initialize and Inject the Component -->
    <script>
        var siteEndpoint = "https://molina5--mo5dev2pro.sandbox.my.salesforce-sites.com/"; // REPLACE ME
        
        // Simulating the hidden AccountNumber parameter set by this hosting website 
        var currentUsersAccountNumber = "ACC-987654321"; 

        $Lightning.use("c:surveyBridgeApp", function() {
            $Lightning.createComponent(
                "c:surveyForm",
                { 
                    accountNumber: currentUsersAccountNumber 
                },
                "survey-form-container",
                function(cmp) {
                    console.log("Survey LWC loaded successfully on GitHub Pages!");
                }
            );
        }, siteEndpoint); 

        // 5. EVENT LISTENER: Listen for the custom event emitted by the LWC
        document.getElementById('survey-form-container').addEventListener('surveysubmitted', function(event) {
            console.log("Captured 'surveysubmitted' event in index.html. Detail:", event.detail);
            // Show the HTML thank you box
            document.getElementById('parent-thanks-box').style.display = 'block';
        });
    </script>
</body>
</html>
